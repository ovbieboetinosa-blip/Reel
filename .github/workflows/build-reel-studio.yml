          cat > app/src/main/java/com/reelstudio/app/Store.java <<'REELEOF'
          package com.reelstudio.app;

          import android.content.Context;
          import java.io.ByteArrayOutputStream;
          import java.io.File;
          import java.io.FileInputStream;
          import java.io.FileOutputStream;
          import java.io.IOException;
          import java.io.InputStream;
          import java.io.OutputStream;
          import java.nio.charset.StandardCharsets;
          import java.util.Locale;

          final class Store {
              private Store() {}

              static File file(Context c) {
                  return new File(c.getFilesDir(), "last.html");
              }

              /** Pasted artifact code has no doctype or body, so wrap it the way a browser page would be. */
              static String normalize(String s) {
                  String low = s.toLowerCase(Locale.ROOT);
                  if (low.contains("<html") || low.contains("<!doctype")) return s;
                  return "<!doctype html><html><head><meta charset=\"utf-8\">"
                          + "<meta name=\"viewport\" content=\"width=device-width,initial-scale=1,viewport-fit=cover\">"
                          + "<style>body{margin:0;font-family:sans-serif}[hidden]{display:none!important}</style>"
                          + "</head><body>" + s + "</body></html>";
              }

              static void save(Context c, String html) throws IOException {
                  try (OutputStream o = new FileOutputStream(file(c))) {
                      o.write(normalize(html).getBytes(StandardCharsets.UTF_8));
                  }
              }

              static String load(Context c) {
                  File f = file(c);
                  if (!f.exists()) return null;
                  try (InputStream in = new FileInputStream(f)) {
                      return readAll(in);
                  } catch (IOException e) {
                      return null;
                  }
              }

              static String readAll(InputStream in) throws IOException {
                  ByteArrayOutputStream b = new ByteArrayOutputStream();
                  byte[] buf = new byte[8192];
                  int n;
                  while ((n = in.read(buf)) > 0) b.write(buf, 0, n);
                  return new String(b.toByteArray(), StandardCharsets.UTF_8);
              }
          }
