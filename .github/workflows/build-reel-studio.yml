      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build the APK
        run: gradle --no-daemon assembleDebug

      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk ReelStudio.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ReelStudio-apk
          path: ReelStudio.apk

      - name: Publish a release with the APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: reel-studio-${{ github.run_number }}
          name: Reel Studio build ${{ github.run_number }}
          files: ReelStudio.apk
