          cat > app/src/main/java/com/reelstudio/app/Saver.java <<'REELEOF'
          package com.reelstudio.app;

          import android.content.ContentResolver;
          import android.content.ContentValues;
          import android.content.Context;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Environment;
          import android.provider.MediaStore;
          import java.io.File;
          import java.io.FileInputStream;
          import java.io.FileOutputStream;
          import java.io.IOException;
          import java.io.InputStream;
          import java.io.OutputStream;

          final class Saver {
              private Saver() {}

              /** Copies the recorded file into the public Movies/ReelStudio folder and returns its content Uri. */
              static Uri toMovies(Context c, File src) throws IOException {
                  String name = src.getName();
                  ContentResolver cr = c.getContentResolver();
                  ContentValues v = new ContentValues();
                  v.put(MediaStore.MediaColumns.DISPLAY_NAME, name);
                  v.put(MediaStore.MediaColumns.MIME_TYPE, "video/mp4");
                  if (Build.VERSION.SDK_INT >= 29) {
                      v.put(MediaStore.MediaColumns.RELATIVE_PATH, Environment.DIRECTORY_MOVIES + "/ReelStudio");
                      v.put(MediaStore.MediaColumns.IS_PENDING, 1);
                      Uri u = cr.insert(MediaStore.Video.Media.EXTERNAL_CONTENT_URI, v);
                      if (u == null) throw new IOException("Could not create the video entry");
                      try (InputStream in = new FileInputStream(src); OutputStream out = cr.openOutputStream(u)) {
                          if (out == null) throw new IOException("Could not open the video entry");
                          copy(in, out);
                      }
                      ContentValues d = new ContentValues();
                      d.put(MediaStore.MediaColumns.IS_PENDING, 0);
                      cr.update(u, d, null, null);
                      return u;
                  }
                  File dir = new File(Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_MOVIES), "ReelStudio");
                  if (!dir.exists() && !dir.mkdirs()) throw new IOException("Could not create the Movies folder");
                  File dst = new File(dir, name);
                  try (InputStream in = new FileInputStream(src); OutputStream out = new FileOutputStream(dst)) {
                      copy(in, out);
                  }
                  v.put(MediaStore.MediaColumns.DATA, dst.getAbsolutePath());
                  return cr.insert(MediaStore.Video.Media.EXTERNAL_CONTENT_URI, v);
              }

              private static void copy(InputStream in, OutputStream out) throws IOException {
                  byte[] buf = new byte[64 * 1024];
                  int n;
                  while ((n = in.read(buf)) > 0) out.write(buf, 0, n);
                  out.flush();
              }
          }
